[project]
name = "notebooks"
version = "0.1.0"
description = "KIKO evaluation notebooks (isolated env)"
authors = [
    {name = "sanjaycg486",email = "gupta.sanjay@fh-swf.de"}
]
readme = "../README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
  "jupyter>=1.0.0,<2.0.0",
  "notebook>=7.2.0,<8.0.0",
  "ipykernel>=6.29.0,<7.0.0",
  "evaluate>=0.4.1,<0.5.0",
  "bert-score>=0.3.13,<0.4.0",
  "rouge-score>=0.1.2,<0.2.0",
  "jiwer>=3.0.0,<4.0.0",
  "scikit-learn>=1.4.0,<2.0.0",
  "pandas>=2.2.0,<3.0.0",
  "matplotlib>=3.8.0,<4.0.0",
  "requests>=2.31.0,<3.0.0",
  "Jinja2>=3.1.0,<4.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "weasyprint>=61.0,<62.0",
  "mlflow>=2.14.0,<3.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
