[tool.poetry]
name = "backend"
version = "0.1.0"
description = "KIKO backend (FastAPI)"
authors = ["hennkar <ole.katzenberger@gmail.com>"]
packages = [{include = "backend"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"

# Core
fastapi = ">=0.140.13"
uvicorn = ">=0.29.0,<0.31.0"
pydantic = ">=2.6.0,<3.0.0"
PyYAML = ">=6.0.1,<7.0.0"

# DB
SQLAlchemy = ">=2.0.29,<2.1.0"
asyncpg = ">=0.29.0,<0.30.0"
psycopg2-binary = ">=2.9.9,<3.0.0"
pgvector = ">=0.5.0,<0.6.0"

# Security
bcrypt = ">=5.0.0,<6.0.0"
cryptography = ">=42.0.0,<47.0.0"
python-jose = ">=3.3.0,<4.0.0"
passlib = ">=1.7.4,<2.0.0"
python-multipart = ">=0.0.18"
python-dotenv = ">=1.0.1,<2.0.0"

# Data science / embeddings / LLMs
numpy = ">=2.1.0,<3.0.0"
pandas = ">=2.2.0,<3.0.0"
scipy = ">=1.11.0,<1.14.0"
scikit-learn = ">=1.4.0,<1.6.0"   # 3.12-compatible; 1.3.0 breaks on Py3.12
sentence-transformers = ">=5.6.1,<6.0.0"
langdetect = "^1.0.9"

transformers = ">=4.56.0,<5.0.0"
accelerate = ">=1.14.0,<1.15.0"

# PyTorch stack
torch = ">=2.6,<2.7"
torchvision = ">=0.21,<0.22"

# Quantization (optional)
bitsandbytes = ">=0.50.0,<0.51.0"

# OCR / CV
pillow = ">=10.3.0,<12.0.0"
pymupdf = ">=1.24.9,<2.0.0"
opencv-python = ">=4.10.0,<5.0.0"
pytesseract = ">=0.3.10,<0.4.0"     # needs Tesseract binary on system
pdf2image = ">=1.17.0,<2.0.0"
surya-ocr = ">=0.4.0,<0.5.0"
timm = ">=1.0.3,<1.1.0"
decord = ">=0.6.0,<0.7.0"
qwen-vl-utils = {version = ">=0.0.8,<0.1.0", extras = ["decord"]}

# RAG / LangChain ecosystem
langchain = ">=0.3.27"
langchain-community = ">=0.3.27"
langchain-huggingface = ">=0.3.1,<0.4"
langchain-ollama = ">=0.2,<0.3"

# Misc utils
requests = ">=2.32.0,<3.0.0"
tqdm = ">=4.66.0,<5.0.0"
json5 = ">=0.15.0,<0.16.0"
urllib3 = ">=2.6.3"
langchain-core = ">=0.3.81"
aiohttp = ">=3.13.3"
filelock = ">=3.20.3"
fasttext-numpy2-wheel = "0.9.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.1.1,<9.0.0"
pytest-asyncio = ">=0.23.6,<0.24.0"
ruff = "^0.15.22"
black = "^24.10.0"
pylint = "^3.2.0"
mypy = "^2.3.0"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"] # E=pycodestyle, F=pyflakes, I=import sorting
ignore = ["E501"]        # Ignore long lines formatted by Black

[tool.pylint]
max-line-length = 88
disable = ["C0114", "C0115", "C0116"] # Ignore missing Docstrings

[build-system]
requires = ["poetry-core>=1.9.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"
